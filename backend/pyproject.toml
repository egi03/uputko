[project]
name = "uputko-backend"
version = "0.2.0"
description = "Uputko: backend (tools, ingest, public API)"
readme = "../README.md"
license = "EUPL-1.2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rapidfuzz>=3.10",
    "shapely>=2.0",
    "pyshp>=2.3",
    "pyproj>=3.7",
    "numpy>=2.0",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20261017",
    "types-shapely>=2.1.0.20261030",
    "xlwt>=1.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    "A",     # shadowed builtins
    "ANN",   # type hints everywhere
    "ARG",   # unused arguments
    "ASYNC", "C4", "DTZ", "FAST", "FLY", "FURB", "G", "ISC", "LOG", "N", "PERF", "PGH", "PIE",
    "BLE",   # a blind except only at a job boundary, marked with the reason
    "FBT",   # boolean flags are keyword-only
    "PLE", "PLW", "PT", "PTH", "RET", "RSE", "SLF", "T10", "T20", "TID", "TRY", "YTT",
    "S",     # bandit
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Croatian text: „quotes”, en dashes
    "S101",    # assert states an internal invariant (type narrowing), never a check
    "SIM905",  # long word lists are written as one string and split
    "TRY003",  # the message is written where the error is raised
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S105", "S608", "SLF001"]
"tests/conftest.py" = ["ARG001"]  # fixtures that need another fixture's rows
"scripts/*" = ["T201"]  # command-line output

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information published for these.
module = ["apscheduler.*", "lxml.*", "shapefile", "xlrd"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
